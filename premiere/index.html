<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenEdit</title>
  <style>
    :root {
      --bg: #232323;
      --panel: #2b2b2b;
      --line: #3a3a3a;
      --text: #d6d6d6;
      --muted: #8f8f8f;
      --accent: #2d8ceb;
      --good: #3fb950;
      --bad: #e5534b;
      --warn: #d29922;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 11px/1.45 -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    body { display: flex; flex-direction: column; padding: 10px; gap: 10px; overflow: hidden; }
    header { display: flex; align-items: center; justify-content: space-between; }
    h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: .2px; }
    h1 span { color: var(--accent); }
    .state { display: flex; align-items: center; gap: 6px; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
    .dot.good { background: var(--good); }
    .dot.bad { background: var(--bad); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 10px; margin: 0; }
    dt { color: var(--muted); }
    dd { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #host-error { color: var(--bad); }
    h2 { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
    .log-card { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #log { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; font-family: Menlo, Consolas, monospace; font-size: 10px; }
    #log li { display: grid; grid-template-columns: 56px 92px 1fr; gap: 6px; padding: 2px 0; border-bottom: 1px solid #303030; }
    #log .t { color: var(--muted); }
    #log .c { color: var(--text); overflow: hidden; text-overflow: ellipsis; }
    #log .m { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #log li.ok .c { color: var(--good); }
    #log li.err .c, #log li.err .m { color: var(--bad); }
    button {
      background: #3a3a3a; color: var(--text); border: 1px solid #4a4a4a; border-radius: 3px;
      font: inherit; padding: 2px 8px; cursor: pointer;
    }
    button:hover { background: #444; }
  </style>
</head>
<body>
  <header>
    <h1>Open<span>Edit</span></h1>
    <div class="state"><span id="state-dot" class="dot"></span><span id="state-text">Starting...</span></div>
  </header>

  <section class="card">
    <dl>
      <dt>Port</dt><dd id="port">-</dd>
      <dt>Token file</dt><dd id="token-path">-</dd>
      <dt>Premiere</dt><dd id="version">-</dd>
      <dt>Project</dt><dd id="project">-</dd>
      <dt>Sequence</dt><dd id="sequence">-</dd>
      <dt></dt><dd id="host-error"></dd>
    </dl>
  </section>

  <section class="card log-card">
    <header>
      <h2>Recent commands</h2>
      <button id="reload-host" title="Re-evaluate the ExtendScript host files">Reload host</button>
    </header>
    <ul id="log"></ul>
  </section>

  <script src="lib/CSInterface.js"></script>
  <script src="panel.js"></script>
</body>
</html>
