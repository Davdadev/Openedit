<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenEdit transcript</title>
<!--#shared-css-->
<style>
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip.filler-chip { color: var(--oe-filler); background: color-mix(in srgb, var(--oe-filler) 10%, transparent); border-color: color-mix(in srgb, var(--oe-filler) 25%, transparent); cursor: pointer; user-select: none; transition: opacity 0.2s; }
  .chip.filler-chip b { color: inherit; }
  .chip.filler-chip.off { opacity: 0.45; }

  .density { position: relative; height: 22px; border-radius: 6px; background: var(--color-background-secondary); margin: 2px 0 10px; overflow: hidden; cursor: pointer; }
  .density .sp { position: absolute; top: 7px; height: 8px; border-radius: 3px; background: color-mix(in srgb, var(--oe-accent) 45%, transparent); animation: oe-fade 0.6s both; }
  .density .fl { position: absolute; top: 3px; bottom: 3px; width: 2px; border-radius: 1px; background: var(--oe-filler); }
  .density .mk { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--color-text-primary); transition: left 0.35s var(--oe-ease); opacity: 0; }
  .density .mk.on { opacity: 1; }
  .density .ht { position: absolute; top: 0; bottom: 0; width: 3px; border-radius: 1px; background: var(--oe-accent); }

  .bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .search { flex: 1; position: relative; }
  .search svg { position: absolute; left: 9px; top: 50%; width: 14px; height: 14px; transform: translateY(-50%); color: var(--color-text-tertiary); }
  .search input {
    width: 100%; height: 30px; border-radius: var(--border-radius-md); border: 1px solid var(--color-border-secondary); background: var(--color-background-secondary);
    color: var(--color-text-primary); font: inherit; font-size: 12.5px; padding: 0 10px 0 30px; outline: none; transition: border-color 0.15s, box-shadow 0.15s;
  }
  .search input:focus { border-color: var(--oe-accent); box-shadow: 0 0 0 3px var(--oe-accent-soft); }
  .count { font-size: 12px; color: var(--color-text-tertiary); min-width: 64px; text-align: right; }

  .body { max-height: 286px; border-top: 1px solid var(--color-border-tertiary); padding-top: 4px; scroll-behavior: smooth; }
  .seg { display: grid; grid-template-columns: 56px 1fr; gap: 10px; padding: 6px 4px 6px 0; border-radius: 8px; animation: oe-fade 0.5s both; }
  .seg .ts { font-size: 11.5px; color: var(--color-text-tertiary); padding-top: 2px; cursor: pointer; text-align: right; }
  .seg .ts:hover { color: var(--oe-accent); }
  .seg .tx { font-size: 13.5px; line-height: 1.75; color: var(--color-text-primary); }
  .w { border-radius: 4px; padding: 1px 1px; margin: 0 -1px; cursor: pointer; transition: background 0.12s, color 0.12s, box-shadow 0.12s; }
  .w:hover { background: var(--color-background-tertiary); }
  .fl-on .w.filler { color: var(--oe-filler); background: color-mix(in srgb, var(--oe-filler) 13%, transparent); font-weight: 500; text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--oe-filler) 55%, transparent); }
  .w.match { background: color-mix(in srgb, var(--oe-accent) 22%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--oe-accent) 40%, transparent); }
  .w.picked { background: var(--oe-accent) !important; color: var(--oe-accent-ink) !important; text-decoration: none !important; }
  .dimmed .w:not(.match) { opacity: 0.55; }

  .sel {
    display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 8px 8px 8px 12px; border-radius: var(--border-radius-md);
    background: var(--color-background-secondary); border: 1px solid var(--color-border-secondary); animation: oe-in 0.3s var(--oe-ease) both; font-size: 12.5px;
  }
  .sel .word { font-weight: 600; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sel .time { color: var(--color-text-secondary); }
  .foot-note { margin-top: 8px; font-size: 11.5px; color: var(--color-text-tertiary); display: flex; gap: 6px; align-items: center; min-width: 0; }
  .foot-note span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div id="app" class="oe-card loading-card">
  <div class="loading-label"><span class="spinner"></span><span id="loading-text">Transcribing speech…</span></div>
  <div class="skeleton" style="height: 22px"></div>
  <div class="skeleton" style="height: 16px; width: 92%"></div>
  <div class="skeleton" style="height: 16px; width: 80%"></div>
  <div class="skeleton" style="height: 16px; width: 86%"></div>
</div>
<!--#shared-js-->
<script>
(function () {
  "use strict";
  var E = OE.esc, clock = OE.clock;
  var app = document.getElementById("app");
  var data, words = [], selected = -1, fillersOn = true;

  OE.on("input", function (a) {
    if (data) return;
    if (a && a.path) document.getElementById("loading-text").textContent = "Transcribing " + String(a.path).split("/").pop() + "… (first run downloads the model)";
  });
  OE.on("result", function (res) {
    var sc = res && res.structuredContent;
    if (res && res.isError || !sc || sc.view !== "transcript") {
      app.className = "oe-card";
      app.innerHTML = '<div class="oe-head"><div class="oe-logo">' + OE.icon("text") + '</div><div class="oe-title">Transcript</div></div><div class="error-box">' + E(OE.textOf(res) || "No transcript in this result.") + "</div>";
      return;
    }
    data = sc;
    render();
  });

  function render() {
    var d = data;
    words = [];
    var html = d.segments.map(function (s, si) {
      var ws = s.words.map(function (w) {
        var i = words.length;
        words.push({ t: w[0], s: w[1], e: w[2], f: w[3], seg: si, n: norm(w[0]) });
        return '<span class="w' + (w[3] ? " filler" : "") + '" data-i="' + i + '">' + E(w[0]) + "</span>";
      }).join(" ");
      return '<div class="seg" style="animation-delay:' + Math.min(si * 30, 600) + 'ms"><span class="ts num" data-t="' + s.start + '">' + clock(s.start) + '</span><div class="tx">' + ws + "</div></div>";
    }).join("");
    var lang = (d.language || "").toUpperCase();
    app.className = "oe-card fl-on";
    app.innerHTML =
      '<div class="oe-head"><div class="oe-logo">' + OE.icon("text") + '</div><div class="oe-title">Transcript</div><div class="oe-sub" title="' + E(d.source) + '">' + E(d.sourceName) + '</div><div class="oe-spacer"></div>' +
      '<div class="chips">' + (lang ? '<span class="chip"><b>' + E(lang) + "</b></span>" : "") + '<span class="chip num">' + clock(d.duration, 0) + '</span><span class="chip"><b class="num">' + d.wordCount.toLocaleString() + "</b> words</span>" +
      '<span class="chip filler-chip" id="fchip" title="Highlight filler words"><span class="dot"></span><b class="num">' + d.fillerCount + "</b> filler" + (d.fillerCount === 1 ? "" : "s") + "</span></div></div>" +
      '<div class="density" id="density"></div>' +
      '<div class="bar"><label class="search">' + OE.icon("search") + '<input id="q" type="search" placeholder="Search the transcript" autocomplete="off" spellcheck="false" /></label><span class="count num" id="count"></span></div>' +
      '<div class="body scroll" id="body">' + html + "</div>" +
      '<div id="selbox"></div>' +
      '<div class="foot-note">' + (d.cached ? "Cached · " : "") + "<span class='mono' title='" + E(d.jsonPath) + "'>" + E(d.jsonPath) + "</span>" + (d.truncated ? " · showing the first " + words.length.toLocaleString() + " words" : "") + "</div>";
    drawDensity();
    wire();
    OE.resize();
  }

  function norm(t) { return String(t).toLowerCase().replace(/[^\p{L}\p{N}']+/gu, ""); }

  function drawDensity() {
    var d = data, el = document.getElementById("density"), dur = d.duration || 1, h = "";
    d.segments.forEach(function (s, i) {
      h += '<span class="sp" style="left:' + (s.start / dur) * 100 + "%;width:" + Math.max(0.3, ((s.end - s.start) / dur) * 100) + "%;animation-delay:" + Math.min(i * 25, 500) + 'ms"></span>';
    });
    words.forEach(function (w) { if (w.f) h += '<span class="fl" style="left:' + (w.s / dur) * 100 + '%"></span>'; });
    h += '<span class="mk" id="mk"></span><span id="hits"></span>';
    el.innerHTML = h;
    el.title = "Speech over time · filler words in amber";
    el.onclick = function (ev) {
      var r = el.getBoundingClientRect(), t = ((ev.clientX - r.left) / r.width) * dur;
      var best = 0;
      words.forEach(function (w, i) { if (Math.abs(w.s - t) < Math.abs(words[best].s - t)) best = i; });
      select(best, true);
    };
  }

  function wire() {
    var body = document.getElementById("body");
    body.addEventListener("click", function (ev) {
      var w = ev.target.closest(".w");
      if (w) return select(Number(w.dataset.i), false);
      var ts = ev.target.closest(".ts");
      if (ts) {
        var t = Number(ts.dataset.t);
        var i = words.findIndex(function (x) { return x.s >= t - 0.001; });
        if (i >= 0) select(i, false);
      }
    });
    document.getElementById("fchip").onclick = function () {
      fillersOn = !fillersOn;
      app.classList.toggle("fl-on", fillersOn);
      this.classList.toggle("off", !fillersOn);
    };
    var q = document.getElementById("q"), t;
    q.addEventListener("input", function () { clearTimeout(t); t = setTimeout(search, 80); });
    q.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") {
        var hits = Array.from(document.querySelectorAll(".w.match"));
        if (!hits.length) return;
        var next = hits.find(function (h) { return Number(h.dataset.i) > selected; }) || hits[0];
        select(Number(next.dataset.i), true);
      }
    });
  }

  function search() {
    var raw = document.getElementById("q").value.trim();
    var body = document.getElementById("body");
    document.querySelectorAll(".w.match").forEach(function (el) { el.classList.remove("match"); });
    var hitsEl = document.getElementById("hits");
    hitsEl.innerHTML = "";
    var count = document.getElementById("count");
    if (!raw) { body.classList.remove("dimmed"); count.textContent = ""; return; }
    var toks = raw.split(/\s+/).map(norm).filter(Boolean);
    var n = 0, first = -1, dur = data.duration || 1, marks = "";
    for (var i = 0; i + toks.length <= words.length; i++) {
      var ok = true;
      for (var k = 0; k < toks.length; k++) {
        var wn = words[i + k].n;
        if (k === toks.length - 1 ? wn.indexOf(toks[k]) !== 0 : wn !== toks[k]) { ok = false; break; }
      }
      if (!ok) continue;
      n++;
      if (first < 0) first = i;
      marks += '<span class="ht" style="left:' + (words[i].s / dur) * 100 + '%"></span>';
      for (k = 0; k < toks.length; k++) document.querySelector('.w[data-i="' + (i + k) + '"]').classList.add("match");
    }
    hitsEl.innerHTML = marks;
    body.classList.toggle("dimmed", n > 0);
    count.textContent = n ? n + " match" + (n > 1 ? "es" : "") : "No matches";
    if (first >= 0) scrollTo(first);
  }

  function scrollTo(i) {
    var el = document.querySelector('.w[data-i="' + i + '"]');
    var body = document.getElementById("body");
    if (!el) return;
    var top = el.offsetTop - body.offsetTop - body.clientHeight / 3;
    body.scrollTop = Math.max(0, top);
  }

  function select(i, scroll) {
    var prev = document.querySelector(".w.picked");
    if (prev) prev.classList.remove("picked");
    selected = i;
    var w = words[i];
    var el = document.querySelector('.w[data-i="' + i + '"]');
    if (el) el.classList.add("picked");
    if (scroll) scrollTo(i);
    var mk = document.getElementById("mk");
    mk.style.left = (w.s / (data.duration || 1)) * 100 + "%";
    mk.classList.add("on");
    var box = document.getElementById("selbox");
    box.innerHTML =
      '<div class="sel" id="sel"><span class="word">“' + E(w.t) + '”</span>' + (w.f ? '<span class="chip filler-chip" style="height:20px">filler</span>' : "") +
      '<span class="time num">' + clock(w.s, 2) + " → " + clock(w.e, 2) + ' <span class="faint">· ' + (w.e - w.s).toFixed(2) + "s</span></span>" +
      '<div class="oe-spacer"></div><button class="btn sm ghost" id="copyt">' + OE.icon("copy") + "Copy time</button>" +
      '<button class="btn sm" id="ask">' + OE.icon("scissors") + "Cut this</button></div>";
    document.getElementById("copyt").onclick = function () {
      OE.copy(w.s.toFixed(2)).then(function (ok) { OE.toast(ok ? "Copied " + w.s.toFixed(2) + "s" : clock(w.s, 2)); });
    };
    document.getElementById("ask").onclick = function () {
      OE.sendMessage("Cut the word “" + w.t + "” at " + clock(w.s, 2) + "–" + clock(w.e, 2) + " (source " + w.s.toFixed(2) + "s–" + w.e.toFixed(2) + "s) from " + data.sourceName + " as a manual cut.")
        .then(function () { OE.toast("Sent to Claude"); }, function () { OE.toast("The host did not accept the message"); });
    };
    OE.resize();
  }

  OE.connect({ name: "openedit-transcript", version: "0.1.0" }).catch(function () {});
})();
</script>
</body>
</html>
