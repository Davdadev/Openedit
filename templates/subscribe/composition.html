<style>
  .sb-wrap { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 1.8rem; }
  .sb-wrap.bottom { left: 50%; bottom: 12%; transform: translateX(-50%); }
  .sb-wrap.bottom-left { left: 6.5%; bottom: 11%; align-items: flex-start; }
  .sb-wrap.bottom-right { right: 6.5%; bottom: 11%; align-items: flex-end; }
  .sb-wrap.center { left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .sb { display: flex; align-items: center; gap: 1.6rem; filter: drop-shadow(0 1.4rem 3.4rem rgba(0, 0, 0, 0.42)); }
  .sb-btn {
    position: relative; height: 9.6rem; border-radius: 99rem; overflow: hidden; background: var(--accent);
    font: 800 3.9rem/1 var(--font), Inter, sans-serif; letter-spacing: -0.01em; color: var(--fg);
  }
  .sb-btn::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0.25rem 0 rgba(255, 255, 255, 0.22), inset 0 -0.3rem 0 rgba(0, 0, 0, 0.12); }
  .sb-gray { position: absolute; inset: 0; background: #2a2b33; opacity: 0; }
  .sb-ripple { position: absolute; width: 10rem; height: 10rem; margin: -5rem 0 0 -5rem; border-radius: 50%; background: rgba(255, 255, 255, 0.45); opacity: 0; }
  .sb-face { position: absolute; top: 0; left: 0; height: 100%; display: flex; align-items: center; gap: 1.4rem; padding: 0 5rem; white-space: nowrap; }
  .sb-face svg { width: 3.6rem; height: 3.6rem; }
  .sb-bell {
    position: relative; width: 9.6rem; height: 9.6rem; border-radius: 50%; display: grid; place-items: center;
    background: rgba(24, 25, 32, 0.82); border: 0.18rem solid rgba(255, 255, 255, 0.16);
  }
  .sb-bell svg { width: 4.6rem; height: 4.6rem; overflow: visible; }
  .sb-dot { position: absolute; top: 1.7rem; right: 1.9rem; width: 1.9rem; height: 1.9rem; border-radius: 50%; background: var(--accent); border: 0.35rem solid #18191f; transform: scale(0); }
  .sb-sub { font: 600 2.5rem/1.2 var(--font), Inter, sans-serif; color: color-mix(in srgb, var(--fg) 85%, transparent); letter-spacing: 0.02em; text-shadow: 0 0.2rem 1.4rem rgba(0, 0, 0, 0.6); }
  .sb-sub:empty { display: none; }
  .sb-cursor { position: absolute; left: 0; top: 0; width: 6.4rem; height: 6.4rem; filter: drop-shadow(0 0.6rem 1.2rem rgba(0, 0, 0, 0.45)); transform-origin: 0.9rem 0.6rem; }
</style>
<div class="sb-wrap {{position}}" id="sb-wrap">
  <div class="sb" id="sb">
    <div class="sb-btn" id="sb-btn">
      <div class="sb-gray" id="sb-gray"></div>
      <div class="sb-ripple" id="sb-ripple"></div>
      <div class="sb-face" id="sb-f1"><span>{{text}}</span></div>
      <div class="sb-face" id="sb-f2">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path id="sb-check" d="M4.5 12.5l5 5 10-11" /></svg>
        <span>{{doneText}}</span>
      </div>
    </div>
    <div class="sb-bell" id="sb-bell">
      <svg viewBox="0 0 24 24" id="sb-bell-ico" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path id="sb-bell-body" d="M6 9.5a6 6 0 0 1 12 0c0 4.6 1.6 6.4 2.3 7.1a.5.5 0 0 1-.36.85H4.06a.5.5 0 0 1-.36-.85C4.4 15.9 6 14.1 6 9.5z" />
        <path id="sb-bell-clap" d="M9.8 20.2a2.4 2.4 0 0 0 4.4 0" />
      </svg>
      <div class="sb-dot" id="sb-dot"></div>
    </div>
  </div>
  <div class="sb-sub" id="sb-sub">{{subtext}}</div>
</div>
<svg class="sb-cursor" id="sb-cursor" viewBox="0 0 32 32">
  <path d="M5 3.5 L5 25.5 L10.6 20.4 L14.4 28.6 L18.6 26.7 L14.9 18.6 L22.6 18.1 Z" fill="#ffffff" stroke="#111318" stroke-width="1.8" stroke-linejoin="round" />
</svg>
<script>
  (function () {
    var P = OE.params, D = OE.duration, E = OE.E, R = OE.rem, W = OE.width, H = OE.height;
    var $ = function (id) { return document.getElementById(id); };
    var showBell = String(P.bell) !== "false";
    if (!showBell) $("sb-bell").style.display = "none";
    var btn = $("sb-btn"), f1 = $("sb-f1"), f2 = $("sb-f2"), gray = $("sb-gray"), rip = $("sb-ripple");
    var bell = $("sb-bell"), bellIco = $("sb-bell-ico"), dot = $("sb-dot"), cur = $("sb-cursor"), sb = $("sb"), sub = $("sb-sub");
    var check = $("sb-check");
    var w1 = f1.offsetWidth, w2 = f2.offsetWidth;
    btn.style.width = w1 + "px";
    var checkLen = check.getTotalLength();
    check.style.strokeDasharray = checkLen + " " + checkLen;
    // Geometry (layout positions; transforms below never change layout).
    function center(el) {
      var r = el.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }
    var outS = Math.max(2.2, D - 0.5);
    // Base choreography authored for 4 s; compress for shorter durations.
    var f = Math.min(1, (outS - 0.15) / 3.35);
    var T = { pop: 0, curIn: 0.45 * f, click1: 1.25 * f, toBell: 1.75 * f, click2: 2.35 * f };
    if (!showBell) T.click2 = 99;

    OE.run(function (t) {
      var bc = center(btn), bb = center(bell);
      // width flips at the click; geometry for the cursor uses the "before" width
      var ck = OE.tw(t, T.click1 + 0.05, 0.45, E.outExpo);
      btn.style.width = OE.lerp(w1, w2, ck).toFixed(2) + "px";
      f1.style.opacity = 1 - OE.tw(t, T.click1 + 0.02, 0.18, E.linear);
      f1.style.transform = "translateY(" + (-OE.tw(t, T.click1, 0.35, E.outCubic) * 2).toFixed(3) + "rem)";
      f2.style.opacity = OE.tw(t, T.click1 + 0.12, 0.25, E.linear);
      f2.style.transform = "translateY(" + ((1 - OE.tw(t, T.click1 + 0.08, 0.4, E.outExpo)) * 2).toFixed(3) + "rem)";
      check.style.strokeDashoffset = (checkLen * (1 - OE.tw(t, T.click1 + 0.18, 0.35, E.outCubic))).toFixed(3);
      gray.style.opacity = OE.tw(t, T.click1 + 0.02, 0.3, E.outCubic);
      // ripple from click point
      var rk = OE.p(t, T.click1, 0.55);
      rip.style.left = w1 / 2 + "px";
      rip.style.top = "50%";
      rip.style.opacity = rk > 0 && rk < 1 ? (0.9 * (1 - rk)).toFixed(3) : 0;
      rip.style.transform = "scale(" + (0.2 + E.outCubic(rk) * 5.5).toFixed(3) + ")";
      // whole unit: pop in / press / out
      var pk = OE.tw(t, T.pop, 0.55, E.outBack), out = OE.tw(t, outS, 0.45, E.inQuart);
      var press = 1 - 0.06 * Math.sin(Math.PI * OE.p(t, T.click1 - 0.06, 0.2));
      sb.style.transform = "translateY(" + ((1 - pk) * 4 + out * 3).toFixed(3) + "rem) scale(" + ((0.7 + 0.3 * pk) * (1 - 0.15 * out)).toFixed(4) + ")";
      sb.style.opacity = Math.min(1, pk * 2) * (1 - out);
      btn.style.transform = "scale(" + press.toFixed(4) + ")";
      sub.style.opacity = OE.tw(t, T.pop + 0.3, 0.5, E.outCubic) * (1 - out);
      sub.style.transform = "translateY(" + ((1 - OE.tw(t, T.pop + 0.3, 0.6, E.outExpo)) * 1.6).toFixed(3) + "rem)";
      // bell
      var bp = 1 - 0.1 * Math.sin(Math.PI * OE.p(t, T.click2 - 0.06, 0.2));
      bell.style.transform = "scale(" + bp.toFixed(4) + ")";
      var rt = t - T.click2;
      var ang = rt > 0 ? 26 * Math.exp(-rt * 3.2) * Math.sin(rt * 26) : 0;
      bellIco.style.transform = "rotate(" + ang.toFixed(3) + "deg)";
      bellIco.style.transformOrigin = "50% 8%";
      bell.style.background = rt > 0 ? "color-mix(in srgb, var(--accent) " + Math.round(OE.tw(t, T.click2, 0.3) * 100) + "%, rgba(24,25,32,0.82))" : "";
      dot.style.transform = "scale(" + OE.tw(t, T.click2 + 0.1, 0.4, E.outBack).toFixed(4) + ")";
      dot.style.opacity = showBell && rt > 0 ? 1 : 0;
      // cursor path: off-screen → button → bell → away
      var start = { x: Math.min(W * 0.98, bc.x + 30 * R), y: Math.min(H * 1.05, bc.y + 22 * R) };
      var p1 = { x: bc.x - w1 * 0.5 + w1 * 0.5 + 1 * R, y: bc.y + 1 * R };
      var p2 = { x: bb.x + 1 * R, y: bb.y + 1.4 * R };
      var endP = { x: p2.x + 18 * R, y: p2.y + 16 * R };
      var a = OE.tw(t, T.curIn, T.click1 - T.curIn - 0.08, E.inOutCubic);
      var b = showBell ? OE.tw(t, T.toBell, T.click2 - T.toBell - 0.08, E.inOutCubic) : 0;
      var c = OE.tw(t, (showBell ? T.click2 : T.click1) + 0.3, 0.6, E.inCubic);
      var x = OE.lerp(start.x, p1.x, a), y = OE.lerp(start.y, p1.y, a);
      // slight arc on the first leg
      y -= Math.sin(Math.PI * a) * 3 * R;
      x = OE.lerp(x, p2.x, b); y = OE.lerp(y, p2.y, b) - Math.sin(Math.PI * b) * 2.5 * R;
      x = OE.lerp(x, endP.x, c); y = OE.lerp(y, endP.y, c);
      var cs = 1 - 0.18 * Math.sin(Math.PI * OE.p(t, T.click1 - 0.06, 0.2)) - 0.18 * Math.sin(Math.PI * OE.p(t, T.click2 - 0.06, 0.2));
      cur.style.transform = "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px) scale(" + cs.toFixed(4) + ")";
      cur.style.opacity = (t >= T.curIn ? 1 : 0) * (1 - c) * (1 - out);
    });
  })();
</script>
