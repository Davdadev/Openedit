<style>
  .scrim { position: absolute; inset: 0; opacity: 0; }
  .scrim.dark { background: rgba(6, 7, 12, 0.76); }
  .scrim.gradient {
    background:
      radial-gradient(80% 90% at 15% 20%, color-mix(in srgb, var(--accent) 45%, transparent) 0%, transparent 60%),
      radial-gradient(70% 80% at 90% 90%, color-mix(in srgb, var(--accent2) 35%, transparent) 0%, transparent 60%),
      rgba(6, 7, 12, 0.82);
  }
  .tc { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 9%; }
  .tc.center { align-items: center; text-align: center; }
  .tc.left { align-items: flex-start; text-align: left; }
  .tc-glow { filter: drop-shadow(0 0.8rem 3.2rem rgba(0, 0, 0, 0.45)); display: flex; flex-direction: column; align-items: inherit; width: 100%; }
  .tc-eyebrow {
    display: inline-flex; align-items: center; gap: 1.3rem; margin-bottom: 3.4rem;
    padding: 1.1rem 2.4rem 1.1rem 1.8rem; border-radius: 99rem;
    font: 700 2.2rem/1 var(--font), Inter, sans-serif; letter-spacing: 0.3em; text-transform: uppercase; color: var(--fg);
    background: rgba(255, 255, 255, 0.09); border: 0.15rem solid rgba(255, 255, 255, 0.2);
  }
  .tc-eyebrow:empty { display: none; }
  .tc-eyebrow i { width: 1.2rem; height: 1.2rem; border-radius: 50%; background: var(--accent); box-shadow: 0 0 1.6rem var(--accent); }
  .tc-title {
    width: 100%; font-family: var(--font), Inter, sans-serif; font-weight: 900; font-size: 15.5rem; line-height: 1;
    letter-spacing: -0.045em; color: var(--fg); text-wrap: balance;
  }
  .tc-title .hl .oe-c { color: var(--accent); }
  .tc-bar { position: relative; width: 24rem; height: 1rem; margin: 4.2rem 0 3.6rem; }
  .tc-bar i { position: absolute; inset: 0; border-radius: 1rem; background: linear-gradient(90deg, var(--accent), var(--accent2)); box-shadow: 0 0 3rem color-mix(in srgb, var(--accent) 60%, transparent); }
  .tc-sub { font: 500 4.4rem/1.3 var(--font), Inter, sans-serif; color: color-mix(in srgb, var(--fg) 82%, transparent); max-width: 78%; }
  .tc-sub:empty, .tc-sub:empty ~ * { display: none; }
</style>
<div class="scrim {{backdrop}}" id="tc-scrim"></div>
<div class="tc {{align}}" id="tc">
  <div class="tc-glow">
    <div class="tc-eyebrow" id="tc-eyebrow"></div>
    <h1 class="tc-title" id="tc-title"></h1>
    <div class="tc-bar" id="tc-bar"><i id="tc-bar-i"></i></div>
    <p class="tc-sub" id="tc-sub">{{subtitle}}</p>
  </div>
</div>
<script>
  (function () {
    var P = OE.params, D = OE.duration, E = OE.E;
    var title = OE.$("#tc-title");
    var T = OE.split(title, P.title, { highlight: P.highlight });
    var eb = OE.$("#tc-eyebrow");
    if (P.eyebrow) eb.innerHTML = "<i></i><span>" + OE.esc(P.eyebrow) + "</span>";
    var bar = OE.$("#tc-bar-i"), sub = OE.$("#tc-sub"), scrim = OE.$("#tc-scrim");
    var hasSub = !!String(P.subtitle || "").trim();
    if (!hasSub) OE.$("#tc-bar").style.marginBottom = "0";
    var left = P.align === "left";
    bar.style.transformOrigin = left ? "left center" : "center";
    var n = T.chars.length;
    var stagger = Math.min(0.032, 0.75 / Math.max(1, n));
    var outS = Math.max(1.2, D - 0.65);
    var outStag = Math.min(0.012, 0.25 / Math.max(1, n));

    OE.run(function (t) {
      OE.fit(title, { maxLines: 2, lineHeight: 1 });
      scrim.style.opacity = OE.life(t, 0, 0.35, D - 0.35, 0.35);
      // eyebrow
      var ek = OE.tw(t, 0.0, 0.6, E.outExpo), eo = OE.tw(t, outS, 0.4, E.inCubic);
      eb.style.opacity = ek * (1 - eo);
      eb.style.transform = "translateY(" + ((1 - ek) * 2 - eo * 2) + "rem)";
      // title characters
      T.chars.forEach(function (c, i) {
        var k = OE.tw(t, 0.1 + i * stagger, 0.85, E.outExpo);
        var o = OE.tw(t, outS + i * outStag, 0.42, E.inQuart);
        var y = (1 - k) * 118 - o * 118;
        var r = (1 - k) * 9;
        c.style.transform = "translate3d(0," + y.toFixed(2) + "%,0) rotate(" + r.toFixed(2) + "deg)";
        c.style.opacity = Math.min(1, k * 2.5);
      });
      // accent bar
      var bk = OE.tw(t, 0.35, 0.9, E.outExpo), bo = OE.tw(t, outS - 0.05, 0.4, E.inQuart);
      bar.style.transform = "scaleX(" + (bk * (1 - bo)).toFixed(4) + ")";
      // subtitle
      if (hasSub) {
        var sk = OE.tw(t, 0.55, 0.9, E.outExpo), so = OE.tw(t, outS - 0.1, 0.35, E.inCubic);
        sub.style.opacity = sk * (1 - so);
        sub.style.letterSpacing = (0.22 * (1 - sk) + 0.01).toFixed(4) + "em";
        sub.style.transform = "translateY(" + ((1 - sk) * 2.4 - so * 1.6).toFixed(3) + "rem)";
        sub.style.filter = "blur(" + ((1 - sk) * 0.8 + so * 0.6).toFixed(3) + "rem)";
      }
    });
  })();
</script>
