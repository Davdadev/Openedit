name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  node:
    name: Build + unit tests (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run build
      - name: vitest
        run: npm test
        env:
          # whisper.cpp is not installed on CI; e2e tests that need it skip themselves or are
          # covered on macOS.
          CI: "true"
      - name: Premiere bridge (mock host)
        run: node premiere/test/mock-test.mjs

  resolve:
    name: Resolve bridge unittests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s resolve/test -v

  macos-app:
    name: macOS app (mac-only)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci && npm run build
      - name: Package app (no DMG)
        working-directory: app
        run: |
          npm ci
          npm run stage
          npx electron-builder --mac dir --arm64 --publish never
      - name: Bundled CLI under ELECTRON_RUN_AS_NODE (MCP handshake)
        working-directory: app
        run: npx playwright test test/cli.spec.ts -g "MCP stdio"
